# ── Harness ──────────────────────────────────────────────────────────────────
harness:
  evaluate_script: harness/evaluate.sh
  target_template: harness/agents/template_opencode_os.sh
  agent_name: opencode_os
  parallel: 4                        # parallel jobs within a single trial
  num_runs: 3                        # CWV measurement runs per repo (median used)
  allow_permanent_inject: false      # gates inject.py only; does NOT affect trial injection

# ── Training data ─────────────────────────────────────────────────────────────
data:
  input_csv: harness/SAMPLE/input.csv
  training_set_csv: harness/prompt_optimisation/data/training_set.csv
  demo_pool_jsonl: harness/prompt_optimisation/data/demo_pool.jsonl
  train_size: 50
  validation_size: 10
  frameworks: [jekyll, hugo, express, static, other]

# ── Proposer (Qwen Coder on vLLM endpoint) ───────────────────────────────────
proposer:
  # Reads OPENCODE_OPENAI_BASE_URL and OPENAI_API_KEY from .env at runtime
  base_url_env: OPENCODE_OPENAI_BASE_URL
  api_key_env: OPENAI_API_KEY
  model_env: VLLM_SERVED_MODEL_NAME
  n_phase1_candidates: 15
  n_phase2_candidates: 15
  temperature: 0.9                   # high for diversity
  dedup_threshold: 0.85              # Jaccard similarity: discard if above this

# ── Demo sets ────────────────────────────────────────────────────────────────
demos:
  n_demo_sets: 8
  demos_per_set: [3, 3, 4, 4, 4, 5, 5, 5]   # size of each of the 8 sets
  bootstrap_threshold: 0.10                   # min optimization score to qualify as demo

# ── Optimization ─────────────────────────────────────────────────────────────
optimization:
  n_trials: 180
  n_startup_trials: 20              # random-search trials before TPE activates
  minibatch_size: 10                # repos per trial (5 pre-partitioned fixed batches)
  seed: 42

# ── Metric ───────────────────────────────────────────────────────────────────
metric:
  # Denominator floors prevent division-by-zero and cap deltas on already-fast repos
  lcp_floor_ms: 100
  inp_floor_ms: 50
  cls_floor: 0.01
  regression_penalty: -1.0

  weights:
    lcp: 0.50
    inp: 0.35
    cls: 0.15

# ── Refinement — Phase 2, not in initial scope ───────────────────────────────
refine:
  enabled: false
  min_improvement_threshold: 0.05   # only refine repos below this score
  max_iterations: 3
  max_repos: 30
